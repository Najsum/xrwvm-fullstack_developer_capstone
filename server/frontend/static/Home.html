<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="static/style.css">
  <link rel="stylesheet" href="static/bootstrap.min.css">
<script>

const logout = async (e) => {
// Build logout URL and Make GET request to logout endpoint
  let logout_url = window.location.origin+"/djangoapp/logout";
  const res = await fetch(logout_url, {
    method: "GET",
  });

  const json = await res.json();
  if (json) {
	// Clear session storage and reload page
    let username = sessionStorage.getItem('username');
    sessionStorage.removeItem('username');
    window.location.href = window.location.origin;
    window.location.reload();
	 // Notify user of logout
    alert("Logging out "+username+"...") 
  }
  else {
    alert("The user could not be logged out.")
  }
};

let checkSession = ()=>{
  let curr_user = sessionStorage.getItem("username");

  if (curr_user && curr_user !== "") {
    document.getElementById("loginlogout").innerHTML = 
    '<span class="homepage_links">' + curr_user +'</span>' +
    '<a class="homepage_links" onclick="logout()" href="/">Logout</a>'
  } else {
    document.getElementById("loginlogout").innerHTML = 
    '<a class="homepage_links" href="/login">Login</a>'+
    '<a class="homepage_links"  href="/register">Register</a>'
  }
 }

const getCars = async () => {
  const results = document.getElementById("cars-results");
  results.replaceChildren();

  try {
    const response = await fetch("/djangoapp/get_cars");
    if (!response.ok) {
      throw new Error("Could not load cars.");
    }

    const data = await response.json();
    const cars = data.CarModels || [];
    if (cars.length === 0) {
      results.textContent = "No cars have been added yet.";
      return;
    }

    const table = document.createElement("table");
    table.className = "table table-striped";
    const header = table.createTHead().insertRow();
    ["Make", "Model"].forEach((label) => {
      const cell = document.createElement("th");
      cell.scope = "col";
      cell.textContent = label;
      header.appendChild(cell);
    });

    const body = table.createTBody();
    cars.forEach((car) => {
      const row = body.insertRow();
      [car.CarMake, car.CarModel].forEach((value) => {
        row.insertCell().textContent = value;
      });
    });
    results.appendChild(table);
  } catch (error) {
    results.textContent = "Unable to load cars. Please try again.";
  }
};
  
</script>
</head>
<body onload="checkSession()">
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
  <div class="container-fluid">
    <h2 style="padding-right: 5%;">Dealerships</h2>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarText">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" style="font-size: larger;" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" style="font-size: larger;" href="/contact">Contact Us</a>
        </li>
      </ul>
      <span class="navbar-text">
        <div class="loginlink" id="loginlogout">
        </div>
        </span>
    </div>
  </div>
</nav>
<div style="display: flex;flex-direction: column;">
<div class="card" style="width: 50%;margin-top: 50px;align-self: center;">
  <img src="static/car_dealership.jpg" class="card-img-top" alt="...">
  <div class="banner">
    <h5>Welcome to our Dealerships!</h5>
    <a href="/dealers" class="btn" style="background-color: aqua;margin:10px">View Dealerships</a>
  </div>
</div>
</div>
<section class="container" style="max-width: 900px; margin: 32px auto;">
  <h3>Cars</h3>
  <p>Select the <strong>Get Cars</strong> button below to check the list of cars added.</p>
  <button type="button" class="btn btn-primary" onclick="getCars()">Get Cars</button>
  <div id="cars-results" aria-live="polite" style="margin-top: 16px;"></div>
</section>
</body>
</html>
